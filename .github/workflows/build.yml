name: Testen & bauen

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      macos:
        description: "Auch macOS bauen (experimentell, kostet mehr Actions-Minuten)"
        type: boolean
        default: false

permissions:
  contents: write   # für Releases bei Tags

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Abhängigkeiten
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[window,dev]" "pyinstaller>=6.10"
      - name: Tests (Windows)
        run: pytest -q
      - name: Selbsttest der gebauten Konfiguration
        run: python -m fach --version
      - name: App bauen (PyInstaller)
        run: pyinstaller --noconfirm packaging/fach.spec
      - name: Selbsttest der gebauten App (PFERD, Keyring, pywebview im Paket)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\Fach\Fach.exe -ArgumentList "--selftest","selftest.json" -PassThru -Wait
          Get-Content selftest.json
          if ($p.ExitCode -ne 0) { throw "Selbsttest fehlgeschlagen ($($p.ExitCode))" }
      - name: Installer bauen (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $version = (Select-String -Path fach/__init__.py -Pattern '__version__ = "(.+)"').Matches[0].Groups[1].Value
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" packaging\windows\fach.iss
          Compress-Archive -Path dist\Fach -DestinationPath "dist\Fach-$version-portable.zip"
      - name: Versionsprüfung (Tag = __version__)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = (Select-String -Path fach/__init__.py -Pattern '__version__ = "(.+)"').Matches[0].Groups[1].Value
          if ("v$version" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} passt nicht zu __version__ $version" }
      - name: Update-Manifest (latest.json)
        shell: pwsh
        run: |
          $version = (Select-String -Path fach/__init__.py -Pattern '__version__ = "(.+)"').Matches[0].Groups[1].Value
          $setup = Get-Item "dist\Fach-Setup-$version.exe"
          git fetch --force --tags --depth=1 2>$null
          $notes = git tag -l --format='%(contents)' "${{ github.ref_name }}" 2>$null
          if (-not $notes) { $notes = "" }
          $manifest = [ordered]@{
            version = $version
            setup = $setup.Name
            sha256 = (Get-FileHash $setup.FullName -Algorithm SHA256).Hash.ToLower()
            size = $setup.Length
            published = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            notes = ($notes -join "`n").Trim()
          }
          $manifest | ConvertTo-Json | Out-File -Encoding utf8NoBOM dist\latest.json
          Get-Content dist\latest.json
      - uses: actions/upload-artifact@v4
        with:
          name: Fach-Windows
          path: |
            dist/Fach-Setup-*.exe
            dist/Fach-*-portable.zip
            dist/latest.json
          retention-days: 30
      - name: Release (nur bei Tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: false
          make_latest: true
          generate_release_notes: false
          files: |
            dist/Fach-Setup-*.exe
            dist/Fach-*-portable.zip
            dist/latest.json

  macos:
    needs: test
    if: github.event_name == 'workflow_dispatch' && inputs.macos
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e ".[window]" "pyinstaller>=6.10"
      - run: pyinstaller --noconfirm packaging/fach.spec
      - run: cd dist && ditto -c -k --keepParent Fach.app Fach-macOS-unsigniert.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Fach-macOS
          path: dist/Fach-macOS-unsigniert.zip
          retention-days: 14
